name: Run Data Pipeline

# Runs automatically every Monday at 06:00 UTC, and can also be triggered
# manually from the GitHub Actions tab ("Run workflow" button) — satisfies
# the "automated, no manual terminal run needed" requirement.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run extract step
        env:
          WB_INDICATOR: SL.TLF.CACT.ZS
        run: python -m src.extract

      - name: Run load step
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.load

      - name: Export CSV for Tableau
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.export_for_tableau

      - name: Upload exported CSV as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-labor-force-csv
          path: data/clean/clean_labor_force.csv
          retention-days: 30
